spring.application.name=vigia
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORTA:3306}/vigia?createDatabaseIfNotExist=true
spring.datasource.username=${DB_USUARIO:root}
spring.datasource.password=${DB_SENHA}
spring.jpa.hibernate.ddl-auto=update
spring.jackson.time-zone=America/Sao_Paulo
spring.config.import=optional:classpath:application-local.properties
vigia.jwt.secret=${JWT_SECRET}
vigia.jwt.expiracao-horas=24
